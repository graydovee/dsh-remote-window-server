# Publish the two artifacts this project owns, on the plugin tag `v<version>`:
#
#   * `dsh-remote-workspace-server-<version>.tgz` (+ `.sha256`, `.manifest.json`) —
#     the server plugin package. The client repo bundles the byte-identical
#     tarball into `assets/server-plugin/`, so both repos release one version.
#   * `dsh-runtime-<dsh version>-<platform>-<arch>[-libc].tar.gz` (+ `.sha256`,
#     `.manifest.json`) — the isolated `node/` + `dsh/` runtime a client uploads
#     to a remote it cannot build for.
#
# The dsh version is never written down here: it is `engines.dsh` in
# package.json, the same field the plugin declares as its peer, so a release
# cannot be built against a dsh the plugin does not support. Dispatch a
# `server-v<dsh version>` tag (or run the workflow manually) to rebuild only the
# runtime matrix for a dsh release without bumping the plugin.
#
# Matrix: linux x64/arm64 (glibc) and darwin x64/arm64. The builder stages POSIX
# Node tarballs (`bin/node`, `.bin/dsh`), so Windows runtime artifacts are not
# produced here yet; a win32 target needs the hoisted layout and `node.exe`
# handling the client's runtime builder already implements.
name: server-packages

on:
  push:
    tags: ['v*', '[0-9]*', 'server-v*']
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'override the dsh version (default: engines.dsh)'
        required: false
        default: ''
      release_tag:
        description: 'tag to attach the assets to (must already exist)'
        required: true

permissions:
  contents: write

env:
  # The client's `NODE_VERSION_CANDIDATES` pins the same build; artifacts that
  # disagree with it are rejected by the launcher probe on the remote.
  NODE_VERSION: '24.21.0'
  # The compatibility table (and the snapshot projected from it) lives with the
  # plugin; this repository downloads the client release asset to build exactly
  # the matrix that plugin version supports.
  CLIENT_REPO: graydovee/dsh-remote-workspace

jobs:
  resolve:
    name: resolve versions
    runs-on: ubuntu-latest
    outputs:
      dsh: ${{ steps.version.outputs.dsh }}
      plugin: ${{ steps.version.outputs.plugin }}
      tag: ${{ steps.version.outputs.tag }}
      interval: ${{ steps.version.outputs.interval }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          plugin="$(node -p "require('./package.json').version")"
          case "${{ github.ref_type }}" in
            tag) tag="${{ github.ref_name }}" ;;
            *) tag="${{ inputs.release_tag }}" ;;
          esac
          # The snapshot is the authority for which runtimes this plugin version
          # supports; a missing snapshot means the two repositories are out of
          # step, so fail before doing any work.
          url="https://github.com/${CLIENT_REPO}/releases/download/v${plugin}/runtime-compat.json"
          curl -fsSL --retry 3 --retry-connrefused -o runtime-compat.json "$url" || {
            echo "cannot download $url" >&2
            exit 1
          }
          # dsh resolution order: explicit dispatch input, then a
          # `server-v<dsh>` tag (a dsh-only rebuild), then `engines.dsh` when it
          # is a single version, and finally the newest runtime in the snapshot
          # when the plugin declares an interval.
          declared="$(node -p "require('./package.json').engines.dsh")"
          override=""
          case "$tag" in server-v*) override="${tag#server-v}" ;; esac
          if [ -n "${{ inputs.dsh_version }}" ]; then override="${{ inputs.dsh_version }}"; fi
          dsh="$(node -e '
            const compat = require("./runtime-compat.json")
            const declared = process.argv[1]
            const override = process.argv[2]
            const newest = compat.runtimes?.[0]?.dsh
            if (override) {
              if (!compat.runtimes.some(item => item.dsh === override)) {
                console.error("snapshot has no runtime entry for dsh " + override)
                process.exit(1)
              }
              process.stdout.write(override)
            } else if (/^\d+\.\d+\.\d+([-+].*)?$/.test(declared)) {
              process.stdout.write(declared)
            } else if (newest) {
              process.stdout.write(newest)
            } else {
              console.error("cannot resolve a dsh version from " + declared)
              process.exit(1)
            }
          ' "$declared" "$override")"
          interval="$(node -p "const c=require('./runtime-compat.json'); c.dsh.min===c.dsh.max?c.dsh.min:c.dsh.min+'..'+c.dsh.max")"
          matrix="$(node -e '
            const compat = require("./runtime-compat.json")
            const dsh = process.argv[1]
            const buildable = new Set(["linux-x64-gnu", "linux-arm64-gnu", "darwin-x64", "darwin-arm64"])
            const entry = compat.runtimes.find(item => item.dsh === dsh)
            if (!entry) { console.error("snapshot has no runtime entry for dsh " + dsh); process.exit(1) }
            const slots = []
            for (const platform of entry.platforms) {
              if (!buildable.has(platform)) continue
              const parts = platform.split("-")
              slots.push({ platform: parts[0], arch: parts[1], libc: parts[2] || "", node_arch: parts[1] })
            }
            if (slots.length === 0) { console.error("nothing to build for dsh " + dsh); process.exit(1) }
            process.stdout.write(JSON.stringify({ include: slots }))
          ' "$dsh")"
          {
            echo "dsh=$dsh"
            echo "plugin=$plugin"
            echo "tag=$tag"
            echo "interval=$interval"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin dsh=$dsh tag=$tag interval=$interval"
          echo "matrix=$matrix"

  plugin:
    name: pack server plugin
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: check sources
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: pack
        run: pnpm pack:server-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: server-plugin
          path: |
            dist/server-plugin/*.tgz
            dist/server-plugin/*.tgz.sha256
            dist/server-plugin/*.tgz.manifest.json
          if-no-files-found: error

  runtime:
    name: runtime ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.libc && format('-{0}', matrix.libc) || '' }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Derived from the client's compatibility snapshot: the release builds only
      # the dsh releases and platforms that plugin version declares, and a
      # platform this builder cannot stage (win32 today) is reported in the notes
      # as "not published yet" instead of failing the release.
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4

      - name: check sources
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      # The builder drives `node <pnpm.cjs> -C <stage> add @deepseek-ai/dsh`, so
      # it needs a pnpm *file* plus a node binary, not a PATH shim.
      - name: host toolchain
        run: |
          set -euo pipefail
          npm install -g pnpm@10
          PNPM_CJS="$(npm root -g)/pnpm/bin/pnpm.cjs"
          test -f "$PNPM_CJS" || { echo "pnpm.cjs not found under $(npm root -g)" >&2; exit 1; }
          echo "DSH_HOST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "DSH_HOST_PNPM=$PNPM_CJS" >> "$GITHUB_ENV"

      - name: download node
        run: |
          set -euo pipefail
          name="node-v${NODE_VERSION}-${{ matrix.platform }}-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 --retry-connrefused -o "$RUNNER_TEMP/$name" \
            "https://nodejs.org/dist/v${NODE_VERSION}/$name"
          echo "NODE_ARCHIVE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: build runtime
        shell: bash
        run: |
          set -euo pipefail
          args=(--dsh-version "${{ needs.resolve.outputs.dsh }}"
                --platform "${{ matrix.platform }}"
                --arch "${{ matrix.arch }}"
                --node-archive "$NODE_ARCHIVE"
                --out dist-runtime)
          if [ -n "${{ matrix.libc }}" ]; then args+=(--libc "${{ matrix.libc }}"); fi
          node scripts/build-runtime-artifact.mjs "${args[@]}"
          ls -l dist-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.libc && format('-{0}', matrix.libc) || '' }}
          path: |
            dist-runtime/*.tar.gz
            dist-runtime/*.tar.gz.sha256
            dist-runtime/*.manifest.json
          if-no-files-found: error

  release:
    name: publish release
    needs: [resolve, plugin, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: download compatibility snapshot
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-connrefused \
            -o dist/runtime-compat.json \
            "https://github.com/${CLIENT_REPO}/releases/download/v${{ needs.resolve.outputs.plugin }}/runtime-compat.json"

      # The body is generated: the supported DSH interval, the platforms that got
      # an artifact and the ones that did not, plus a sha256 per file. Hand-written
      # notes drifted from the manifest before.
      - name: render release notes
        run: |
          set -euo pipefail
          node scripts/render-release-notes.mjs \
            --compat dist/runtime-compat.json \
            --plugin "${{ needs.resolve.outputs.plugin }}" \
            --dsh "${{ needs.resolve.outputs.dsh }}" \
            --dist dist \
            --out release-notes.md
          cat release-notes.md

      - name: list assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: dsh-remote-workspace-server ${{ needs.resolve.outputs.plugin }} · runtime for dsh ${{ needs.resolve.outputs.dsh }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tgz
            dist/*.tgz.sha256
            dist/*.tgz.manifest.json
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.manifest.json
            dist/runtime-compat.json
